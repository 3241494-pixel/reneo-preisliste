<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Preisliste Generator · ReNeo Homecare</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&subset=cyrillic&display=swap" rel="stylesheet">
<style>
:root{--red:#E1262C;--ink:#161616;--mute:#7a7a7a;--line:#e6e6e6;--ui:#f3f2f1;--panel:#ffffff;
--f:Inter,"Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--f);color:var(--ink);background:var(--ui)}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.app{display:grid;grid-template-columns:330px 1fr;gap:28px;padding:28px 24px;max-width:1100px;margin:0 auto;align-items:start}
.ui{position:sticky;top:20px;background:var(--panel);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:18px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.ui img{height:34px;align-self:flex-start}
.ui h1{font-size:20px;font-weight:800;letter-spacing:-.01em}
.ui p.lead{font-size:13px;color:var(--mute);line-height:1.5;margin-top:-10px}
.f{display:flex;flex-direction:column;gap:6px}
.f label{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:#555}
.f input,.f select{font:inherit;font-size:15px;padding:10px 12px;border:1px solid #d8d6d4;border-radius:8px;background:#fff;color:var(--ink);width:100%}
.f input:focus,.f select:focus{outline:2px solid var(--red);outline-offset:1px;border-color:transparent}
.pct{display:flex;align-items:center;gap:10px}
.pct input[type=number]{font-size:28px;font-weight:800;width:120px;padding:6px 12px}
.pct span{font-size:24px;font-weight:800;color:var(--mute)}
.pct input[type=range]{flex:1;accent-color:var(--red)}
.chk{display:flex;gap:8px;align-items:center;font-size:14px}
.chk input{accent-color:var(--red);width:16px;height:16px}
.stat{font-size:13px;line-height:1.5;background:#faf8f7;border-radius:8px;padding:10px 12px;color:#444}
.stat b{color:var(--ink)}
button{font:inherit;font-weight:700;font-size:15px;background:var(--red);color:#fff;border:0;border-radius:10px;padding:14px;cursor:pointer}
button:hover{filter:brightness(.95)}button:focus-visible{outline:3px solid #000;outline-offset:2px}
.lang{display:flex;gap:4px;align-self:flex-start;background:#f3f2f1;border-radius:8px;padding:3px}
.lang button{background:transparent;color:#555;font-size:12px;padding:5px 12px;border-radius:6px}
.lang button[aria-pressed=true]{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.hint{font-size:12px;color:var(--mute);line-height:1.5}
/* ---------- sheet (A5) ---------- */
.sheet{background:#fff;width:148mm;max-width:100%;margin:0 auto;padding:9mm 10mm 10mm;box-shadow:0 2px 14px rgba(0,0,0,.08)}
.hd{display:flex;justify-content:space-between;align-items:flex-end;gap:4mm}
.hd h2{font-weight:900;color:var(--red);font-size:32pt;letter-spacing:-.04em;line-height:.9}
.hd .kick{font-size:7.4pt;letter-spacing:.28em;text-transform:uppercase;font-weight:700;margin-top:3mm}
.hd .salon{font-size:9pt;font-weight:700;margin-top:2mm;letter-spacing:0;text-transform:none}
.hd img{height:10mm}
.note{display:flex;justify-content:space-between;font-size:6.8pt;color:#777;letter-spacing:.06em;text-transform:uppercase;padding:4mm 0 2.5mm;border-bottom:1.5pt solid var(--ink)}
.s{padding-top:2.6mm}
.s h3{font-size:12pt;font-weight:800;letter-spacing:-.02em;color:var(--red);break-after:avoid}
.r{display:flex;align-items:baseline;gap:2mm;padding:.95mm 0;border-bottom:.5pt solid var(--line);break-inside:avoid}
.r .c{width:10mm;flex:none;font-size:7.4pt;font-weight:600;color:#8a8a8a}
.r .n{font-weight:700;font-size:9pt}
.r .v{font-size:7.6pt;color:#8a8a8a;white-space:nowrap}
.r .d{flex:1;border-bottom:1pt dotted #b5b5b5;transform:translateY(-.8mm);min-width:3mm}
.r .u{font-weight:800;font-size:10pt}
.nocode .r .c{display:none}
.ft{margin-top:4mm;padding-top:2.5mm;border-top:1.5pt solid var(--ink);font-size:7.6pt;line-height:1.6;break-inside:avoid}
.ft b{font-size:8.4pt}
.ft:empty{display:none}
@media (max-width:820px){.app{grid-template-columns:1fr;padding:16px}.ui{position:static}.sheet{padding:6mm 5mm}}
@page{size:A5;margin:0}
.pg{width:100%;border-collapse:collapse}.pg td{padding:0}.pg thead,.pg tfoot{display:none}
@media print{
 body{background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 .ui{display:none}.app{display:block;padding:0;max-width:none}
 .sheet{box-shadow:none;width:auto;padding:0 10mm;margin:0}
 .pg thead{display:table-header-group}.pg tfoot{display:table-footer-group}
 .pg thead td div{height:9mm}.pg tfoot td div{height:10mm}
}
</style></head><body>
