:root{--red:#E1262C;--ink:#161616;--mute:#7a7a7a;--line:#e6e6e6;--ui:#f3f2f1;--panel:#fff;--f:PL,"Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--f);color:var(--ink);background:var(--ui)}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.app{display:grid;grid-template-columns:330px 1fr;gap:28px;padding:28px 24px;max-width:1100px;margin:0 auto;align-items:start}
.ui{position:sticky;top:20px;background:var(--panel);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:18px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.ui>img{height:34px;align-self:flex-start}
.ui h1{font-size:20px;font-weight:800;letter-spacing:-.01em}
.ui p.lead{font-size:13px;color:var(--mute);line-height:1.5;margin-top:-10px}
.f{display:flex;flex-direction:column;gap:6px}
.f label{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:#555}
.f input,.f select{font:inherit;font-size:15px;padding:10px 12px;border:1px solid #d8d6d4;border-radius:8px;background:#fff;color:var(--ink);width:100%}
.f input:focus,.f select:focus{outline:2px solid var(--red);outline-offset:1px;border-color:transparent}
.pct{display:flex;align-items:center;gap:10px}
.pct input[type=number]{font-size:28px;font-weight:800;width:120px;padding:6px 12px}
.pct span{font-size:24px;font-weight:800;color:var(--mute)}
input[type=range]{accent-color:var(--red);width:100%}
.chk{display:flex;gap:8px;align-items:center;font-size:14px}
.chk input{accent-color:var(--red);width:16px;height:16px}
.stat{font-size:13px;line-height:1.5;background:#faf8f7;border-radius:8px;padding:10px 12px;color:#444}
.stat b{color:var(--ink)}
.btn{font:inherit;font-weight:700;font-size:15px;background:var(--red);color:#fff;border:0;border-radius:10px;padding:14px;cursor:pointer}
.btn:disabled{opacity:.6;cursor:wait}
.btn.sec{background:transparent;color:var(--ink);border:1px solid #d8d6d4;font-size:14px;padding:11px}
.btn:focus-visible{outline:3px solid #000;outline-offset:2px}
.hint{font-size:12px;color:var(--mute);line-height:1.5}
[hidden]{display:none!important}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:#f3f2f1;border-radius:10px;padding:4px}
.seg button{font:inherit;font-size:13px;font-weight:700;border:0;cursor:pointer;background:transparent;color:#555;padding:9px 6px;border-radius:7px;line-height:1.25}
.seg button[aria-pressed=true]{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.lang{display:flex;gap:4px;align-self:flex-start;background:#f3f2f1;border-radius:8px;padding:3px}
.lang button{font:inherit;border:0;cursor:pointer;background:transparent;color:#555;font-size:12px;font-weight:700;padding:5px 12px;border-radius:6px}
.lang button[aria-pressed=true]{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}
/* ---------- A5 pages ---------- */
.pages{display:flex;flex-direction:column;gap:18px;align-items:center}
.page{width:148mm;height:210mm;background:#fff;box-shadow:0 2px 14px rgba(0,0,0,.08);padding:9mm 10mm 10mm;overflow:hidden;position:relative}
.inner{height:100%;overflow:hidden;--s:1}
.page{font-family:PL,Arial,sans-serif;font-kerning:none;font-variant-ligatures:none;font-feature-settings:normal;text-rendering:geometricPrecision}.page .num{font-variant-numeric:normal}
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:calc(4mm*var(--s))}
.hd h2{font-weight:900;color:var(--red);font-size:calc(21pt*var(--s));letter-spacing:-.03em;line-height:1}
.hd .kick{font-size:calc(7.4pt*var(--s));letter-spacing:.28em;text-transform:uppercase;font-weight:700;margin-top:calc(2.5mm*var(--s))}
.hd .salon{font-size:calc(9.5pt*var(--s));font-weight:800;margin-top:calc(3mm*var(--s))}
.hd .ct{font-size:calc(7.6pt*var(--s));color:#555;margin-top:.8mm;line-height:1.45}
.hd img{height:calc(16mm*var(--s));flex:none}
.note{display:flex;justify-content:space-between;font-size:calc(6.8pt*var(--s));color:#777;letter-spacing:.06em;text-transform:uppercase;padding:calc(4mm*var(--s)) 0 calc(2.5mm*var(--s));border-bottom:calc(1.5pt*var(--s)) solid var(--ink)}
h3{font-size:calc(12pt*var(--s));font-weight:800;letter-spacing:-.02em;color:var(--red);padding-top:calc(2.6mm*var(--s))}
.r{display:flex;align-items:baseline;gap:calc(2mm*var(--s));padding:.95mm 0;border-bottom:.5pt solid var(--line)}
.r .c{width:calc(10mm*var(--s));flex:none;font-size:calc(7.4pt*var(--s));font-weight:600;color:#8a8a8a}
.r .n{font-weight:700;font-size:calc(9pt*var(--s))}
.r .v{font-size:calc(7.6pt*var(--s));color:#8a8a8a;white-space:nowrap}
.r .d{flex:1;border-bottom:calc(1pt*var(--s)) dotted #b5b5b5;transform:translateY(-.8mm);min-width:calc(3mm*var(--s))}
.r .u{font-weight:800;font-size:calc(10pt*var(--s))}
.nocode .r .c{display:none}
.ft{margin-top:calc(4mm*var(--s));padding-top:calc(2.5mm*var(--s));border-top:calc(1.5pt*var(--s)) solid var(--ink);font-size:calc(7.6pt*var(--s));line-height:1.6}
.ft b{font-size:calc(8.4pt*var(--s))}
@media (max-width:820px){.app{grid-template-columns:1fr;padding:16px}.ui{position:static}}
@page{size:A5;margin:0}
@media print{
 body{background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 .ui{display:none}.app{display:block;padding:0;max-width:none}
 .pages{display:block;zoom:1!important}.page{box-shadow:none;break-after:page}.page:last-child{break-after:auto}
}

function price(p,m,rd){let x=p*(1+m/100);
 if(rd===0.9){let e=Math.floor(x)+0.9;if(e+1e-9<x)e+=1;return e}
 if(rd>0)x=Math.ceil(x/rd-1e-9)*rd;
 return Math.round(x*100)/100}
function newPage(host){const pg=el('div','page'),inn=el('div','inner');pg.appendChild(inn);host.appendChild(pg);return inn}
function render(){
 let m=parseFloat(String($('m').value).replace(',','.'));if(!isFinite(m)||m<0)m=0;
 const rd=parseFloat($('rd').value),PL=$('pl').value,sn=$('sn').value.trim(),sc=$('sc').value.trim();
 const blocks=[];let sum=0,sumU=0;
 const hd=el('div','hd');

 blocks.push({e:hd,k:true});
 blocks.push({e:el('div','note','<span>'+P[PL].n1+'</span><span>'+P[PL].n2+'</span>'),k:true});
 DATA.forEach((s,si)=>{blocks.push({e:el('h3',null,PL==='ru'?s.sr:s.s),sec:si});
  for(const i of s.i){const v=MODE==='u'?i.u:price(i.p,m,rd);sum+=v;sumU+=i.u;
   blocks.push({e:el('div','r','<span class="c">'+i.c+'</span><span class="n">'+i.n+'</span><span class="v">'+i.v+'</span><span class="d"></span><span class="u num">'+eur(v)+'</span>')})}});
 if(sn||sc)blocks.push({e:el('div','ft',(sn?'<b>'+esc(sn)+'</b>':'')+(sn&&sc?'<br>':'')+esc(sc))});
 // fixed 2 pages: split before the 4th section, shrink a page slightly if it overflows
 const meas=$('measure');meas.innerHTML='';meas.className=$('cd').checked?'':'nocode';
 const splitAt=blocks.findIndex(b=>b.sec===3);
 [blocks.slice(0,splitAt),blocks.slice(splitAt)].forEach(part=>{const inn=newPage(meas);part.forEach(b=>inn.appendChild(b.e));
  let lo=0.7,hi=1;inn.style.setProperty('--s',1);
  if(inn.scrollHeight>inn.clientHeight+0.5){for(let k=0;k<12;k++){const mid=(lo+hi)/2;inn.style.setProperty('--s',mid);
    if(inn.scrollHeight>inn.clientHeight+0.5)hi=mid;else lo=mid}inn.style.setProperty('--s',lo)}});
 const pages=$('pages');pages.innerHTML='';pages.className='pages'+($('cd').checked?'':' nocode');
 while(meas.firstChild)pages.appendChild(meas.firstChild);
 fit();

function fit(){const p=$('pages'),pg=p.querySelector('.page');if(!pg)return;p.style.zoom=1;

const PX=25.4/96, ASC=1984/2048;
const FONTN={400:'PL400',500:'PL400',600:'PL600',700:'PL700',800:'PL800',900:'PL900'};
function rgb(c){const m=c.match(/[\d.]+/g)||[0,0,0];return m.slice(0,3).map(Number)}
function drawText(doc,node,o){const pe=node.parentElement,cs=getComputedStyle(pe);
 if(cs.display==='none'||cs.visibility==='hidden')return;
 let txt=node.nodeValue;if(!txt.trim())return;if(cs.textTransform==='uppercase')txt=txt.toUpperCase();
 const fs=parseFloat(cs.fontSize),w=Math.round(parseInt(cs.fontWeight)/100)*100;
 doc.setFont(FONTN[w]||'PL400','normal');doc.setFontSize(fs*0.75);doc.setTextColor(...rgb(cs.color));
 const ls=cs.letterSpacing==='normal'?0:parseFloat(cs.letterSpacing)*PX;
 // group characters into visual lines
 const mk=document.createElement('span');mk.style.cssText='display:inline-block;width:0;height:0;vertical-align:baseline;padding:0;margin:0;border:0';
 pe.insertBefore(mk,node);const by=mk.getBoundingClientRect().top;const r=document.createRange();r.setStart(node,0);r.setEnd(node,1);const r0=r.getClientRects()[0];mk.remove();
 const off=r0?(by-r0.top)*PX:ASC*fs*PX;let line='',lx=null,lt=null;
 const flush=()=>{if(line.trim()&&lx!=null)doc.text(line.replace(/\s+$/,''),lx,lt+off,{charSpace:ls,baseline:'alphabetic'});line='';lx=null};
 const raw=node.nodeValue;
 for(let i=0;i<raw.length;i++){r.setStart(node,i);r.setEnd(node,i+1);const rc=r.getClientRects()[0];
  const ch=cs.textTransform==='uppercase'?raw[i].toUpperCase():raw[i];
  if(!rc){line+=ch;continue}
  const t=(rc.top-o.top)*PX,x=(rc.left-o.left)*PX;
  if(lt!=null&&Math.abs(t-lt)>fs*PX*0.5){flush()}
  if(lx==null){if(/\s/.test(ch))continue;lx=x;lt=t}
  line+=ch}
 flush()}
function drawBorders(doc,e,o){const cs=getComputedStyle(e);if(cs.display==='none')return;const rc=e.getBoundingClientRect();
 const side=(w,st,col,y)=>{w=parseFloat(w);if(!w||st==='none')return;doc.setDrawColor(...rgb(col));doc.setLineWidth(w*PX);
  if(st==='dotted')doc.setLineDashPattern([w*PX*0.01,w*PX*2],0),doc.setLineCap('round');else doc.setLineDashPattern([],0),doc.setLineCap('butt');
  doc.line((rc.left-o.left)*PX,y,(rc.right-o.left)*PX,y);doc.setLineDashPattern([],0);doc.setLineCap('butt')};
 side(cs.borderTopWidth,cs.borderTopStyle,cs.borderTopColor,(rc.top-o.top+parseFloat(cs.borderTopWidth)/2)*PX);
 side(cs.borderBottomWidth,cs.borderBottomStyle,cs.borderBottomColor,(rc.bottom-o.top-parseFloat(cs.borderBottomWidth)/2)*PX)}
async function downloadPDF(){

 try{await document.fonts.ready;

  for(const w of [400,600,700,800,900]){doc.addFileToVFS('PL'+w+'.ttf',FONTS[w]);doc.addFont('PL'+w+'.ttf','PL'+w,'normal')}
  const list=[...pages.querySelectorAll('.page')];
  list.forEach((pg,i)=>{if(i)doc.addPage('a5','portrait');const o=pg.getBoundingClientRect();
   pg.querySelectorAll('*').forEach(e=>{drawBorders(doc,e,o);
    if(e.tagName==='IMG'){const rc=e.getBoundingClientRect();doc.addImage(e.src,'PNG',(rc.left-o.left)*PX,(rc.top-o.top)*PX,rc.width*PX,rc.height*PX,'logo','FAST')}});
   const tw=document.createTreeWalker(pg,NodeFilter.SHOW_TEXT);let n;while(n=tw.nextNode())drawText(doc,n,o)});
  const sn=$('sn').value.trim().replace(/[^\wäöüÄÖÜß-]+/g,'_').replace(/^_|_$/g,'');
  doc.save('ReNeo_'+P[$('pl').value].file+(sn?'_'+sn:'')+'.pdf');
 }catch(e){console.error(e);alert(e)}
 finally{pages.style.zoom=z;btn.disabled=false;btn.textContent=T[UL].pdf}}
